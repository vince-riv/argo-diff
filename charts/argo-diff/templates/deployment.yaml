apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argo-diff.fullname" . }}
  namespace: {{ include "argo-diff.namespace" . }}
  labels:
    {{- include "argo-diff.labels" . | nindent 4 }}
    app.kubernetes.io/component: "webhook-processor"
  {{- with .Values.deployment.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  replicas: {{ .Values.deployment.replicas }}
  {{- with .Values.deployment.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "argo-diff.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.config.configMapCreate }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.secret.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.deployment.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/component: "webhook-processor"
        {{- include "argo-diff.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "argo-diff.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.deployment.podSecurityContext | nindent 8 }}
      {{- if .Values.argocdCli.image.tag }}
      initContainers:
        - name: argocd-cli
          image: "{{ .Values.argocdCli.image.registry }}/{{ .Values.argocdCli.image.repository }}:{{ .Values.argocdCli.image.tag }}"
          imagePullPolicy: {{ .Values.argocdCli.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cp /usr/local/bin/argocd /argocd-cli/argocd
              chmod 0755 /argocd-cli/argocd
          securityContext:
            {{- toYaml .Values.deployment.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.deployment.resources | nindent 12 }}
          volumeMounts:
            - name: argocd-cli
              mountPath: /argocd-cli
      {{- end }}
      containers:
        - name: argo-diff
          command: {{ .Values.command }}
          securityContext:
            {{- toYaml .Values.deployment.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "{{ .Values.logLevel }}"
            {{- if .Values.argocdCli.image.tag }}
            - name: ARGOCD_CLI_CMD_NAME
              value: "/argocd-cli/argocd"
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "argo-diff.configMapName" . | quote }}
            - secretRef:
                name: {{ include "argo-diff.secretName" . | quote }}
          livenessProbe:
            {{- toYaml .Values.deployment.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.deployment.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.deployment.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.deployment.resources | nindent 12 }}
          {{- if or .Values.argocdCli.image.tag .Values.deployment.volumeMounts }}
          volumeMounts:
            {{- if .Values.argocdCli.image.tag }}
            - name: argocd-cli
              mountPath: /argocd-cli
              readOnly: true
            {{- end }}
            {{- with .Values.deployment.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.argocdCli.image.tag .Values.deployment.volumes }}
      volumes:
        {{- if .Values.argocdCli.image.tag }}
        - name: argocd-cli
          emptyDir:
            sizeLimit: {{ .Values.argocdCli.volumeSizeLimit }}
        {{- end }}
        {{- with .Values.deployment.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
