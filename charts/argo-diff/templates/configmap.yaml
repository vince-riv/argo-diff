---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "argo-diff.configMapName" . }}
  namespace: {{ include "argo-diff.namespace" . }}
  labels:
    {{- include "argo-diff.labels" . | nindent 4 }}
  {{- with .Values.config.configMapAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.config }}
{{- /* commentIndexCount is normalized to a string because 0 is a meaningful
       value for it ("never render the index"), and `with`/`or` treat a numeric
       0 as unset. */ -}}
{{- $indexCount := "" }}
{{- if not (kindIs "invalid" .commentIndexCount) }}
{{- $indexCount = toString .commentIndexCount }}
{{- end }}
{{- if or .argocd.grpcWeb .argocd.grpcWebRoot .argocd.serverAddr .argocd.serverInsecure
          .argocd.serverPlainText .argocd.uiBaseURL .commentPreamble .contextStr .commentLineMaxChars
          .commentNotice .commentCollapse .commentCollapseAppCount .commentCollapseResourceCount
          $indexCount .commentMaxChars
          .maxWorkers .github.application.id .github.application.installationId }}
data:
  {{- with .argocd.grpcWeb }}
  ARGOCD_GRPC_WEB: {{ . | quote }}
  {{- end }}
  {{- with .argocd.grpcWebRoot }}
  ARGOCD_GRPC_WEB_ROOT_PATH: {{ . | quote }}
  {{- end }}
  {{- with .argocd.serverAddr }}
  ARGOCD_SERVER_ADDR: {{ . | quote }}
  {{- end }}
  {{- with .argocd.serverInsecure }}
  ARGOCD_SERVER_INSECURE: {{ . | quote }}
  {{- end }}
  {{- with .argocd.serverPlainText }}
  ARGOCD_SERVER_PLAINTEXT: {{ . | quote }}
  {{- end }}
  {{- with .argocd.uiBaseURL }}
  ARGOCD_UI_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .commentPreamble }}
  ARGO_DIFF_COMMENT_PREAMBLE: {{ . | quote }}
  {{- end }}
  {{- with .contextStr }}
  ARGO_DIFF_CONTEXT_STR: {{ . | quote }}
  {{- end }}
  {{- with .commentLineMaxChars }}
  COMMENT_LINE_MAX_CHARS: {{ . | quote }}
  {{- end }}
  {{- with .commentNotice }}
  ARGO_DIFF_COMMENT_NOTICE: {{ . | quote }}
  {{- end }}
  {{- with .commentCollapse }}
  ARGO_DIFF_COMMENT_COLLAPSE: {{ . | quote }}
  {{- end }}
  {{- with .commentCollapseAppCount }}
  ARGO_DIFF_COMMENT_COLLAPSE_APP_COUNT: {{ . | quote }}
  {{- end }}
  {{- with .commentCollapseResourceCount }}
  ARGO_DIFF_COMMENT_COLLAPSE_RESOURCE_COUNT: {{ . | quote }}
  {{- end }}
  {{- with $indexCount }}
  ARGO_DIFF_COMMENT_INDEX_COUNT: {{ . | quote }}
  {{- end }}
  {{- with .commentMaxChars }}
  ARGO_DIFF_COMMENT_MAX_CHARS: {{ . | quote }}
  {{- end }}
  {{- with .maxWorkers }}
  ARGO_DIFF_MAX_WORKERS: {{ . | quote }}
  {{- end }}
  {{- with .github.application.id }}
  GITHUB_APP_ID: {{ . | quote }}
  {{- end }}
  {{- with .github.application.installationId }}
  GITHUB_APP_INSTALLATION_ID: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
