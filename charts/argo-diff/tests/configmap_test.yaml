---
suite: configmap tests
templates:
  - configmap.yaml
tests:
  - it: no config - no data
    release:
      name: argo-diff
    template: configmap.yaml
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: ConfigMap
          name: argo-diff-env
      - notExists:
          path: data
  - it: config annotations
    set:
      config.configMapAnnotations:
        is_unittest: "yes"
    asserts:
      - equal:
          path: metadata.annotations.is_unittest
          value: "yes"
  - it: config commentPreamble
    set:
      config.commentPreamble: testing
    asserts:
      - equal:
          path: data.ARGO_DIFF_COMMENT_PREAMBLE
          value: testing
  - it: config contextStr
    set:
      config.contextStr: testing
    asserts:
      - equal:
          path: data.ARGO_DIFF_CONTEXT_STR
          value: testing
  - it: config commentLineMaxChars
    set:
      config.commentLineMaxChars: 12345
    asserts:
      - equal:
          path: data.COMMENT_LINE_MAX_CHARS
          value: "12345"
  - it: config commentNotice
    set:
      config.commentNotice: "feature X is deprecated|use Y instead"
    asserts:
      - equal:
          path: data.ARGO_DIFF_COMMENT_NOTICE
          value: "feature X is deprecated|use Y instead"
  - it: config commentCollapse
    set:
      config.commentCollapse: collapsed
    asserts:
      - equal:
          path: data.ARGO_DIFF_COMMENT_COLLAPSE
          value: "collapsed"
  - it: config commentIndexCount
    set:
      config.commentIndexCount: 5
    asserts:
      - equal:
          path: data.ARGO_DIFF_COMMENT_INDEX_COUNT
          value: "5"
  # 0 means "never render the index" - a meaningful value that a plain `with`
  # would drop, so the template normalizes it to a string first
  - it: config commentIndexCount zero
    set:
      config.commentIndexCount: 0
    asserts:
      - equal:
          path: data.ARGO_DIFF_COMMENT_INDEX_COUNT
          value: "0"
  - it: config commentIndexCount always
    set:
      config.commentIndexCount: -1
    asserts:
      - equal:
          path: data.ARGO_DIFF_COMMENT_INDEX_COUNT
          value: "-1"
  - it: config commentMaxChars
    set:
      config.commentMaxChars: 60000
    asserts:
      - equal:
          path: data.ARGO_DIFF_COMMENT_MAX_CHARS
          value: "60000"
  - it: config maxWorkers
    set:
      config.maxWorkers: 8
    asserts:
      - equal:
          path: data.ARGO_DIFF_MAX_WORKERS
          value: "8"
  - it: config argocd.grpcWeb
    set:
      config.argocd.grpcWeb: true
    asserts:
      - equal:
          path: data.ARGOCD_GRPC_WEB
          value: "true"
  - it: config argocd.grpcWebRoot
    set:
      config.argocd.grpcWebRoot: testing
    asserts:
      - equal:
          path: data.ARGOCD_GRPC_WEB_ROOT_PATH
          value: testing
  - it: config argocd.serverAddr
    set:
      config.argocd.serverAddr: testing
    asserts:
      - equal:
          path: data.ARGOCD_SERVER_ADDR
          value: testing
  - it: config argocd.serverInsecure
    set:
      config.argocd.serverInsecure: true
    asserts:
      - equal:
          path: data.ARGOCD_SERVER_INSECURE
          value: "true"
  - it: config argocd.serverPlainText
    set:
      config.argocd.serverPlainText: true
    asserts:
      - equal:
          path: data.ARGOCD_SERVER_PLAINTEXT
          value: "true"
  - it: config argocd.uiBaseURL
    set:
      config.argocd.uiBaseURL: testing
    asserts:
      - equal:
          path: data.ARGOCD_UI_BASE_URL
          value: testing
  - it: config github.application.id
    set:
      config.github.application.id: testing
    asserts:
      - equal:
          path: data.GITHUB_APP_ID
          value: testing
  - it: config github.application.installationId
    set:
      config.github.application.installationId: testing
    asserts:
      - equal:
          path: data.GITHUB_APP_INSTALLATION_ID
          value: testing
