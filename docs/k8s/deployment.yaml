---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-diff
  labels:
    app: argo-diff
    app.kubernetes.io/name: argo-diff
    app.kubernetes.io/instance: argo-diff
    app.kubernetes.io/component: webhook-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argo-diff
  template:
    metadata:
      labels:
        app: argo-diff
        app.kubernetes.io/name: argo-diff
        app.kubernetes.io/instance: argo-diff
        app.kubernetes.io/component: webhook-processor
    spec:
      imagePullSecrets:
        - name: ecr-login
      containers:
        - name: worker
          image: argo-diff:CHANGEME
          imagePullPolicy: Always
          #imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: "debug"
            - name: ARGOCD_SERVER_ADDR
              value: argocd-server.argocd.svc.cluster.local:80
            - name: ARGOCD_SERVER_INSECURE
              value: "true"
            - name: ARGOCD_SERVER_PLAINTEXT
              value: "true"
            - name: ARGOCD_UI_BASE_URL
              value: https://argocd.your.domain
            - name: GITHUB_APP_ID
              value: ""
            - name: GITHUB_APP_INSTALLATION_ID
              value: ""
            - name: ARGO_DIFF_CONTEXT_STR
              value: ""
            # Optional PR comment tuning - see the environment variable table in README.md
            #- name: ARGO_DIFF_COMMENT_NOTICE
            #  value: "argo-diff is being migrated to the new cluster on 1 Oct"
            #- name: ARGO_DIFF_COMMENT_COLLAPSE
            #  value: "auto"
            #- name: ARGO_DIFF_COMMENT_INDEX_COUNT
            #  value: "2"
            #- name: ARGO_DIFF_COMMENT_MAX_CHARS
            #  value: "262144"
          envFrom:
            - secretRef:
                name: argo-diff-env
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 10
            periodSeconds: 2
          resources: {}
          #  limits:
          #    cpu: 250m
          #    memory: 250Mi
          #  requests:
          #    cpu: 10m
          #    memory: 45Mi
          #env:
          #  - name: AWS_DEFAULT_REGION
          #    value: us-east-1
