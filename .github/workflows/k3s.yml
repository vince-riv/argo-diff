---
name: K3s Argo-Diff Test

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to test (fork-PR path). Review the fork diff first: the run executes PR code with a pull-requests:write token.'
        required: true
        type: string
      argocd_version:
        description: 'argocd CLI version to bundle into the argo-diff image (e.g. v3.5.2); leave blank to use the version pinned in the Dockerfile'
        required: false
        type: string
        default: ''
  pull_request:
    branches: ["main"]
    paths:
      - '.github/workflows/k3s.yml'
      - '.github/actions/k3s-argocd/**'
      - 'test/**'
      - 'charts/test-basic-deployment/**'
      - '**/**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'

# SECURITY: on workflow_dispatch this job checks out and runs PR-authored code
# (go build, docker build, test/run-argo-diff-pod.sh) with the token below. A
# maintainer must review the fork's diff before dispatching. The token is held
# to pull-requests:write (comment post/edit) - no contents or packages write -
# which bounds the blast radius of a malicious fork PR.
permissions:
  contents: read
  pull-requests: write

env:
  ARGOCD_OPTS: '--port-forward --port-forward-namespace argocd --insecure --plaintext'
  # Built in-workflow and side-loaded into k3d - never pushed to a registry, so
  # this test has no dependency on the "Docker build" workflow or ghcr.io.
  ARGO_DIFF_IMAGE: argo-diff:e2e

jobs:
  k3s:
    # workflow_dispatch: always. This is the manual path for fork PRs - a fork
    # PR gets a read-only GITHUB_TOKEN on pull_request and cannot post the
    # argo-diff comment, and github.event.workflow_run.pull_requests was always
    # empty for forks, so the old workflow_run path could not resolve them.
    # pull_request: only for same-repo branches; fork PRs must use workflow_dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        k8s: [v1.34]  # v1.33, v1.32, v1.31, v1.30]
    name: K8s ${{ matrix.k8s }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR context
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR: ${{ github.event.inputs.pr }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_REF: ${{ github.head_ref }}
          EVENT_BASE_REF: ${{ github.base_ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # Fork PRs expose no PR context in the event payload, so read it back
            # from the API. `gh pr view` accepts a number, "#123", or a PR URL;
            # .number normalizes whatever was typed to the canonical integer.
            pr_json=$(gh pr view "$DISPATCH_PR" --json number,headRefName,baseRefName,headRefOid)
            PR_NUMBER=$(jq -r '.number' <<<"$pr_json")
            HEAD_REF=$(jq -r '.headRefName' <<<"$pr_json")
            BASE_REF=$(jq -r '.baseRefName' <<<"$pr_json")
            HEAD_SHA=$(jq -r '.headRefOid' <<<"$pr_json")
          else
            PR_NUMBER="$EVENT_PR_NUMBER"
            HEAD_REF="$EVENT_HEAD_REF"
            BASE_REF="$EVENT_BASE_REF"
            HEAD_SHA="$EVENT_HEAD_SHA"
          fi

          if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
            echo "::error::Could not determine a PR number to test"
            exit 1
          fi

          {
            echo "PR_NUMBER=${PR_NUMBER}"
            echo "HEAD_REF=${HEAD_REF}"
            echo "BASE_REF=${BASE_REF}"
            echo "HEAD_SHA=${HEAD_SHA}"
            echo "PR_REF=refs/pull/${PR_NUMBER}/merge"
          } >> "$GITHUB_OUTPUT"

          echo "PR number: ${PR_NUMBER}"
          echo "Head ref (source branch): ${HEAD_REF}"
          echo "Base ref (target branch): ${BASE_REF}"
          echo "Head sha: ${HEAD_SHA}"

      - name: Git Checkout
        id: git_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Check out the resolved head commit, not refs/pull/<n>/merge: the
          # merge ref is absent when the PR has conflicts and can move if the PR
          # author pushes mid-run. A pinned sha always exists and matches the
          # HEAD_SHA we report. argo-diff computes the real diff against the live
          # PR via the API, so a local merge preview would add nothing.
          ref: ${{ steps.pr_info.outputs.HEAD_SHA }}
          fetch-depth: '50'
          fetch-tags: 'true'

      - name: Set up the k3s test cluster
        id: k3s_cluster
        timeout-minutes: 20
        uses: ./.github/actions/k3s-argocd
        with:
          k8s: ${{ matrix.k8s }}
          image: ${{ env.ARGO_DIFF_IMAGE }}
          argocd_version: ${{ github.event.inputs.argocd_version }}

      - name: Run argo-diff (healthy)
        id: argo_diff_healthy
        timeout-minutes: 2
        env:
          POD_NAME_PREFIX: argo-diff-healthy
          IMAGE: ${{ env.ARGO_DIFF_IMAGE }}
          # A non-default argocd_version gets its own context string (and thus
          # its own PR comment) so a pinned-version dispatch doesn't clobber
          # the standard run's comment on the same PR.
          ARGO_DIFF_CONTEXT_STR: ${{ github.event.inputs.argocd_version == '' && 'ephemeral-environment-test' || format('ephemeral-environment-test-argocd-{0}', github.event.inputs.argocd_version) }}
          ARGO_DIFF_COMMENT_PREAMBLE: ${{ github.event.inputs.argocd_version != '' && format('Testing with bundled argocd CLI `{0}` (overridden via workflow_dispatch input `argocd_version`).', github.event.inputs.argocd_version) || '' }}
          ARGO_DIFF_SHA: ${{ steps.pr_info.outputs.HEAD_SHA }}
          ARGO_DIFF_HEAD_REF: ${{ steps.pr_info.outputs.HEAD_REF }}
          ARGO_DIFF_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REF: ${{ steps.pr_info.outputs.PR_REF }}
          EXPECT_EXIT: "0"
        run: test/run-argo-diff-pod.sh

      - name: Swap in failing ArgoCD application
        id: argo_diff_swap
        timeout-minutes: 1
        run: |
          # meta has selfHeal: true and would resurrect the apps we're about to
          # delete, so neutralize it first. Its children carry no finalizers
          # and delete instantly.
          kubectl -n argocd patch application meta --type=merge -p '{"metadata":{"finalizers":null}}'
          kubectl -n argocd delete application meta --ignore-not-found
          kubectl -n argocd delete application basic-deployment helm-deployment --ignore-not-found
          kubectl -n argocd apply -f test/argocd-broken-app.yaml --server-side=true
          echo "--- App List ---"
          argocd app list

      - name: Run argo-diff (manifest failure)
        id: argo_diff_failure
        timeout-minutes: 2
        env:
          POD_NAME_PREFIX: argo-diff-failure
          IMAGE: ${{ env.ARGO_DIFF_IMAGE }}
          # See the healthy-run step above: a non-default argocd_version gets
          # its own context string/comment here too.
          ARGO_DIFF_CONTEXT_STR: ${{ github.event.inputs.argocd_version == '' && 'ephemeral-environment-test-failure' || format('ephemeral-environment-test-failure-argocd-{0}', github.event.inputs.argocd_version) }}
          ARGO_DIFF_COMMENT_PREAMBLE: ${{ github.event.inputs.argocd_version != '' && format('Testing with bundled argocd CLI `{0}` (overridden via workflow_dispatch input `argocd_version`) - manifest failure scenario.', github.event.inputs.argocd_version) || '' }}
          ARGO_DIFF_SHA: ${{ steps.pr_info.outputs.HEAD_SHA }}
          ARGO_DIFF_HEAD_REF: ${{ steps.pr_info.outputs.HEAD_REF }}
          ARGO_DIFF_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REF: ${{ steps.pr_info.outputs.PR_REF }}
          EXPECT_EXIT: nonzero
          REQUIRE_LOG: "Failed to diff application broken-deployment"
        run: test/run-argo-diff-pod.sh
