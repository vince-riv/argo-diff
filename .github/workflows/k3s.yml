---
name: K3s Argo-Diff Test

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to test (use this for fork PRs)'
        required: true
        type: string
  pull_request:
    branches: ["main"]
    paths:
      - '.github/workflows/k3s.yml'
      - 'test/**'
      - 'charts/test-basic-deployment/**'
      - '**/**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'

permissions:
  contents: read
  pull-requests: write

env:
  ARGOCD_OPTS: '--port-forward --port-forward-namespace argocd --insecure --plaintext'
  # Built in-workflow and side-loaded into k3d - never pushed to a registry, so
  # this test has no dependency on the "Docker build" workflow or ghcr.io.
  ARGO_DIFF_IMAGE: argo-diff:e2e

jobs:
  k3s:
    # workflow_dispatch: always. This is the manual path for fork PRs - a fork
    # PR gets a read-only GITHUB_TOKEN on pull_request and cannot post the
    # argo-diff comment, and github.event.workflow_run.pull_requests was always
    # empty for forks, so the old workflow_run path could not resolve them.
    # pull_request: only for same-repo branches; fork PRs must use workflow_dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        k8s: [v1.34]  # v1.33, v1.32, v1.31, v1.30]
    name: K8s ${{ matrix.k8s }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR context
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR: ${{ github.event.inputs.pr }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_REF: ${{ github.head_ref }}
          EVENT_BASE_REF: ${{ github.base_ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # Fork PRs expose no PR context in the event payload, so read it
            # back from the API using the dispatched PR number.
            PR_NUMBER="$DISPATCH_PR"
            pr_json=$(gh pr view "$PR_NUMBER" --json headRefName,baseRefName,headRefOid)
            HEAD_REF=$(jq -r '.headRefName' <<<"$pr_json")
            BASE_REF=$(jq -r '.baseRefName' <<<"$pr_json")
            HEAD_SHA=$(jq -r '.headRefOid' <<<"$pr_json")
          else
            PR_NUMBER="$EVENT_PR_NUMBER"
            HEAD_REF="$EVENT_HEAD_REF"
            BASE_REF="$EVENT_BASE_REF"
            HEAD_SHA="$EVENT_HEAD_SHA"
          fi

          if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
            echo "::error::Could not determine a PR number to test"
            exit 1
          fi

          {
            echo "PR_NUMBER=${PR_NUMBER}"
            echo "HEAD_REF=${HEAD_REF}"
            echo "BASE_REF=${BASE_REF}"
            echo "HEAD_SHA=${HEAD_SHA}"
            echo "PR_REF=refs/pull/${PR_NUMBER}/merge"
          } >> "$GITHUB_OUTPUT"

          echo "PR number: ${PR_NUMBER}"
          echo "Head ref (source branch): ${HEAD_REF}"
          echo "Base ref (target branch): ${BASE_REF}"
          echo "Head sha: ${HEAD_SHA}"

      - name: Git Checkout
        id: git_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The PR merge ref works for same-repo and fork PRs alike, so the
          # workflow scripts and test fixtures come from the PR under test.
          ref: refs/pull/${{ steps.pr_info.outputs.PR_NUMBER }}/merge
          fetch-depth: '50'
          fetch-tags: 'true'

      - name: Set up Go
        id: setup_go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build argo-diff binary
        id: go_build
        timeout-minutes: 3
        run: |
          mkdir -p temp
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X main.Version=$(git describe --tags --always --dirty 2>/dev/null || echo e2e)" \
            -o temp/argo-diff-linux-amd64 ./cmd

      - name: Build argo-diff image
        id: docker_build
        timeout-minutes: 3
        run: docker build --build-arg TARGETARCH=amd64 -t "$ARGO_DIFF_IMAGE" -f Dockerfile .

      - name: K3d/K3s Setup
        id: k3s_setup
        timeout-minutes: 2
        uses: nolar/setup-k3d-k3s@v1
        with:
          version: ${{ matrix.k8s }}
          k3d-args: -p 8080:443@loadbalancer

      - name: K3s Cluster verification
        id: k3s_verify
        timeout-minutes: 1
        run: kubectl version

      - name: Import argo-diff image into k3d
        id: k3d_import
        timeout-minutes: 2
        run: |
          set -euo pipefail
          cluster=$(k3d cluster list -o json | jq -r '.[0].name')
          echo "Importing $ARGO_DIFF_IMAGE into k3d cluster: $cluster"
          k3d image import "$ARGO_DIFF_IMAGE" --cluster "$cluster"

      - name: Install ArgoCD via HelmChart CRD
        id: argocd_install
        timeout-minutes: 1
        run: |
          kubectl create namespace argocd
          kubectl apply -n kube-system -f test/argocd-helmchart.yaml --server-side=true

      - name: Wait for HelmChart to deploy
        id: argocd_helm_wait
        timeout-minutes: 2
        run: |
          echo "Waiting for HelmChart to be processed..."
          sleep 2
          job_name=$(kubectl -n kube-system get helmchart argocd -o jsonpath='{.status.jobName}')
          test -n "$job_name" || exit 1
          while sleep 1 ; do
            kubectl -n kube-system wait --for=condition=complete job/$job_name --timeout=1s && exit 0 || true
            kubectl -n kube-system wait --for=condition=failed job/$job_name --timeout=1s && exit 1 || true
          done

      - name: Wait for ArgoCD pods to be ready
        id: argocd_server_wait
        timeout-minutes: 3
        run: |
          echo "Waiting for ArgoCD pods to launch..."
          while [[ -z "$(kubectl -n argocd get pods -l app.kubernetes.io/name=argocd-server --no-headers=true)" ]]; do
            sleep 1
          done
          echo "Waiting for argocd-server pods to be ready ..."
          kubectl -n argocd wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server --timeout=180s

      - name: Debug pods if installation fails
        id: argocd_pod_debug
        timeout-minutes: 1
        if: failure()
        run: |
          kubectl -n argocd get pods -o yaml

      - name: Create ArgoCD test applications
        timeout-minutes: 1
        id: argocd_app_install
        run: |
          kubectl -n argocd apply -k test/argocd-applications/ --server-side=true
          kubectl -n argocd apply -f test/argocd-meta.yaml --server-side=true

      - name: Install ArgoCD CLI
        id: argocd_cli_install
        timeout-minutes: 2
        run: |
          curl -sSL -o /tmp/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /tmp/argocd
          sudo mv /tmp/argocd /usr/local/bin/argocd
          argocd version --client

      - name: Sync Application and wait for ready
        id: argocd_app_sync
        timeout-minutes: 4
        run: |
          echo "--- App List ---"
          argocd app list
          echo "--- Wait - meta ---"
          argocd app wait meta
          echo "--- Wait - basic-deployment ---"
          argocd app wait basic-deployment
          echo "--- Wait - helm-deployment ---"
          argocd app wait helm-deployment
          #echo "--- Meta ---"
          #argocd app get meta -o tree
          #echo "--- Basic-Deployment ---"
          #argocd app get basic-deployment -o tree
          #echo "--- Helm-Deployment ---"
          #argocd app get helm-deployment -o tree
          echo
          echo "--- App List ---"
          argocd app list

      - name: Run argo-diff (healthy)
        id: argo_diff_healthy
        timeout-minutes: 2
        env:
          POD_NAME_PREFIX: argo-diff-healthy
          IMAGE: ${{ env.ARGO_DIFF_IMAGE }}
          ARGO_DIFF_CONTEXT_STR: ephemeral-environment-test
          ARGO_DIFF_SHA: ${{ steps.pr_info.outputs.HEAD_SHA }}
          ARGO_DIFF_HEAD_REF: ${{ steps.pr_info.outputs.HEAD_REF }}
          ARGO_DIFF_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REF: ${{ steps.pr_info.outputs.PR_REF }}
          EXPECT_EXIT: "0"
        run: test/run-argo-diff-pod.sh

      - name: Swap in failing ArgoCD application
        id: argo_diff_swap
        timeout-minutes: 1
        run: |
          # meta has selfHeal: true and would resurrect the apps we're about to
          # delete, so neutralize it first. Its children carry no finalizers
          # and delete instantly.
          kubectl -n argocd patch application meta --type=merge -p '{"metadata":{"finalizers":null}}'
          kubectl -n argocd delete application meta --ignore-not-found
          kubectl -n argocd delete application basic-deployment helm-deployment --ignore-not-found
          kubectl -n argocd apply -f test/argocd-broken-app.yaml --server-side=true
          echo "--- App List ---"
          argocd app list

      - name: Run argo-diff (manifest failure)
        id: argo_diff_failure
        timeout-minutes: 2
        env:
          POD_NAME_PREFIX: argo-diff-failure
          IMAGE: ${{ env.ARGO_DIFF_IMAGE }}
          ARGO_DIFF_CONTEXT_STR: ephemeral-environment-test-failure
          ARGO_DIFF_SHA: ${{ steps.pr_info.outputs.HEAD_SHA }}
          ARGO_DIFF_HEAD_REF: ${{ steps.pr_info.outputs.HEAD_REF }}
          ARGO_DIFF_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REF: ${{ steps.pr_info.outputs.PR_REF }}
          EXPECT_EXIT: nonzero
          REQUIRE_LOG: "Failed to diff application broken-deployment"
        run: test/run-argo-diff-pod.sh
