name: Helm Lint and Test
permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'charts/argo-diff/**'
      - '.github/workflows/helm.yml'

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: d3adb5/helm-unittest-action@985d798b675caa501251573380b5e026ff768c50 # v2
        with:
          charts: charts/argo-diff
          unittest-version: "0.7.2"
          helm-version: "3.16.4"
      - run: helm lint charts/argo-diff
