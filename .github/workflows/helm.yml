name: Helm Lint and Test
permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'charts/argo-diff/**'
      - '.github/workflows/helm.yml'

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: d3adb5/helm-unittest-action@850bc76597579183998069830d5fa8c3ef0ea34a # v2
        with:
          charts: charts/argo-diff
          unittest-version: "0.7.2"
          helm-version: "3.16.4"
      - run: helm lint charts/argo-diff
